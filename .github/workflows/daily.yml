name: RankersChoice Daily CA Agent

on:
  schedule:
    - cron: "30 20 * * *"   # 2:00 AM IST daily
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      
      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev zlib1g-dev
      
      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔍 Verify secrets are set
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_CA_CATEGORY_ID: ${{ secrets.WP_CA_CATEGORY_ID }}
        run: |
          echo "=== Secrets Check ==="
          if [ -z "$GROQ_API_KEY" ]; then echo "❌ GROQ_API_KEY is missing!"; exit 1; else echo "✅ GROQ_API_KEY is set"; fi
          if [ -z "$WP_USER" ]; then echo "❌ WP_USER is missing!"; exit 1; else echo "✅ WP_USER is set"; fi
          if [ -z "$WP_APP_PASSWORD" ]; then echo "❌ WP_APP_PASSWORD is missing!"; exit 1; else echo "✅ WP_APP_PASSWORD is set"; fi
          if [ -z "$WP_CA_CATEGORY_ID" ]; then echo "❌ WP_CA_CATEGORY_ID is missing!"; else echo "✅ WP_CA_CATEGORY_ID is set (optional)"; fi
          echo "=== Python Version ==="
          python --version
      
      - name: 🚀 Run RankersChoice CA Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_CA_CATEGORY_ID: ${{ secrets.WP_CA_CATEGORY_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u agent.py
